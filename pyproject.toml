# Installs the jpc- commands into the active Python environment - once
# for each environment that should have them.
#
#   conda activate YOUR-ENVIRONMENT      (any name - JPC_AV is just an example)
#   cd ~/github/jpc/aspace_jpc_av        (your checkout)
#   python -m pip install -e .
#
# EDITABLE (-e) is required: the commands run the tools from this folder,
# so `git pull` keeps them current. Reinstall only when a command is added
# or renamed. Only jpc.py is packaged - never creds.py, sheets, reports or
# logs (no package discovery in this multi-folder repo).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jpc-av-tools"
version = "3.6.10"
description = "jpc- commands for the JPC AV ArchivesSpace workflow"
authors = [{ name = "Bleakley McDowell" }, { email = "bleakleym@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.32.4"]
license = "Unlicense"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/JPC-AV/aspace_jpc_av"

[project.scripts]
jpc = "jpc:main"
jpc-pull = "jpc:pull"
jpc-check = "jpc:check"
jpc-fill = "jpc:fill"
jpc-import = "jpc:import_"
jpc-update = "jpc:update"
jpc-writeback = "jpc:writeback"
jpc-rename = "jpc:rename"
jpc-mads = "jpc:mads"

[tool.setuptools]
py-modules = ["jpc"]
